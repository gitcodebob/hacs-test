homeassistant:
  name: Dev Container

# ~Loads default set of integrations. Do not remove.~
# default_config:

# Dev container configuration — replaces default_config to avoid multicast
# errors on Docker Desktop for Windows (zeroconf/ssdp require IP_ADD_MEMBERSHIP
# which is not supported by the Docker vEthernet adapter).

# Core UI
frontend:
config:

# Logging
logger:
  default: warning
  logs:
    custom_components: debug

# Other safe default_config components
automation: !include automations.yaml
script: !include scripts.yaml
scene: !include scenes.yaml

# Fake P1 power meter for end-to-end testing of home_battery_control.
# Drive the value from Developer Tools -> States by changing input_number.fake_p1.
input_number:
  fake_p1:
    name: "Fake P1 (W)"
    min: -5000
    max: 5000
    step: 10
    initial: 0

template:
  - sensor:
      - name: "Fake P1"
        unique_id: "fake_p1"
        state: "{{ states('input_number.fake_p1') | float(0) }}"
        unit_of_measurement: "W"
        device_class: "power"
        state_class: "measurement"
