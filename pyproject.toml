[project]
name = "home-battery-control"
version = "0.1.0"
requires-python = ">=3.12,<3.14"

[dependency-groups]
dev = [
    "pytest",
    "pytest-homeassistant-custom-component",
    "pytest-asyncio",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]

[tool.coverage.run]
source = ["custom_components/home_battery_control"]

[tool.pyright]
# HA's flow-result TypedDicts mark every key as NotRequired, so direct
# subscript access in tests is flagged on every config-flow assertion.
# This is signal-to-noise bad; HA core disables the rule in its own tests.
reportTypedDictNotRequiredAccess = "none"
