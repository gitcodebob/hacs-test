[project]
name = "home-battery-control"
version = "0.1.0"
requires-python = ">=3.12,<3.14"

[dependency-groups]
dev = [
    "pytest",
    "pytest-homeassistant-custom-component",
    "pytest-asyncio",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.coverage.run]
source = ["custom_components/home_battery_control"]
